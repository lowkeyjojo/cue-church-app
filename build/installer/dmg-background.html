<!doctype html>
<!-- The Finder window shown when Cue's disk image is opened (640 × 400).
     Finder draws the two icons and their names itself: the app at (170, 208)
     and the Applications folder at (470, 208). Their names are black in Light
     Mode and white in Dark Mode, so they sit on a mid-tone tray that suits both. -->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2')
      format('woff2');
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  @font-face {
    font-family: 'Plex Mono';
    src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2')
      format('woff2');
    font-weight: 500;
  }
  html,
  body {
    margin: 0;
    width: 640px;
    height: 400px;
    overflow: hidden;
  }
  /* Flat, like the app: warm black, one amber rule, the instruction set large. */
  body {
    position: relative;
    font-family: 'Archivo', sans-serif;
    background: #10100f;
    color: #f3f0e9;
  }
  body::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: #f7a81b;
  }
  .title {
    position: absolute;
    top: 30px;
    left: 40px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .title b {
    color: #f7a81b;
    font-weight: 800;
  }
  .sub {
    position: absolute;
    top: 72px;
    left: 40px;
    font-family: 'Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #807d75;
  }
  /* The tray the two icons and their Finder labels rest on. */
  .tray {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 122px;
    height: 180px;
    border-radius: 3px;
    background: #74726b;
  }
  .arrow {
    position: absolute;
    left: 50%;
    top: 208px;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 5px;
  }
  .arrow svg:nth-child(1) {
    opacity: 0.35;
  }
  .arrow svg:nth-child(2) {
    opacity: 0.65;
  }
  .foot {
    position: absolute;
    bottom: 30px;
    left: 40px;
    right: 40px;
    font-size: 11.5px;
    color: #807d75;
  }
</style>
<div class="title">Drag <b>Cue</b> into Applications</div>
<div class="sub">Then open it from Applications or Launchpad.</div>
<div class="tray"></div>
<div class="arrow">
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#10100f"
      stroke-width="3.5"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#10100f"
      stroke-width="3.5"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#10100f"
      stroke-width="3.5"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </svg>
</div>
<div class="foot">
  The first time, macOS asks you to confirm: System Settings → Privacy
  <span style="font-family: Helvetica, Arial, sans-serif">&amp;</span> Security → Open Anyway.
</div>
