<!doctype html>
<!-- The Finder window shown when Cue's disk image is opened (640 × 400).
     Finder draws the two icons and their names itself: the app at (170, 208)
     and the Applications folder at (470, 208). Their names are black in Light
     Mode and white in Dark Mode, so they sit on a mid-tone tray that suits both. -->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
      format('woff2');
    font-weight: 100 900;
  }
  html,
  body {
    margin: 0;
    width: 640px;
    height: 400px;
    overflow: hidden;
  }
  /* The app's own colours: black into walnut, beige words, a touch of sage. */
  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(460px 260px at 50% -10%, rgba(147, 170, 126, 0.16), transparent 70%),
      linear-gradient(180deg, #1c1916 0%, #0a0908 100%);
    color: #f4eee2;
  }
  .title {
    position: absolute;
    top: 36px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .title b {
    color: #a7bc93;
    font-weight: 650;
  }
  .sub {
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12.5px;
    color: #bdb5a6;
  }
  /* The tray the two icons and their Finder labels rest on. */
  .tray {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 122px;
    height: 180px;
    border-radius: 24px;
    background: #8a8475;
    box-shadow: inset 0 1px 0 rgba(255, 244, 220, 0.25);
  }
  .arrow {
    position: absolute;
    left: 50%;
    top: 208px;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 5px;
  }
  .arrow svg:nth-child(1) {
    opacity: 0.35;
  }
  .arrow svg:nth-child(2) {
    opacity: 0.65;
  }
  .foot {
    position: absolute;
    bottom: 32px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11.5px;
    color: #8b8375;
  }
</style>
<div class="title">Drag <b>Cue</b> into Applications</div>
<div class="sub">Then open it from Applications or Launchpad.</div>
<div class="tray"></div>
<div class="arrow">
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#151311"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#151311"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <svg width="16" height="26" viewBox="0 0 16 26">
    <path
      d="M3 3l10 10L3 23"
      fill="none"
      stroke="#151311"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</div>
<div class="foot">
  The first time, macOS asks you to confirm: System Settings → Privacy
  <span style="font-family: Helvetica, Arial, sans-serif">&amp;</span> Security → Open Anyway.
</div>
