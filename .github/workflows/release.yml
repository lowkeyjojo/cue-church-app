name: Release

# Builds the macOS and Windows apps. Push a tag like v1.0.0 to publish them
# as a GitHub release. Or run it by hand: give a version to publish the
# release (the tag is created on the commit it runs on), or none to just get
# the files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, like v1.0.0 (leave empty to only build the files)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
          - name: Windows
            os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # All optional. Without them the apps are built unsigned (macOS: ad-hoc).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Install what was just built, the way a user would, and make sure Cue
      # opens. An installer that doesn't work is never uploaded or published.
      - name: Install and start Cue (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*/*.exe | Where-Object { $_.Name -match 'setup' -and $_.Name -notmatch 'arm64' } | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was built' }
          Write-Host "Installing $($installer.Name)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = $null
          foreach ($i in 1..60) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Cue.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $exe) { throw 'The installer finished but Cue.exe was not installed' }
          Write-Host "Installed to $($exe.FullName)"
          node scripts/smoke-installed.mjs $exe.FullName
      - name: Install and start Cue (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls release/*/*.dmg | grep -v x64 | head -1)
          echo "Opening $dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/cue-dmg"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/cue-dmg/Cue.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/cue-dmg"
          # A broken signature makes macOS call the app "damaged" and refuse to open it.
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Applications/Cue.app"
          node scripts/smoke-installed.mjs "$RUNNER_TEMP/Applications/Cue.app/Contents/MacOS/Cue"

      - uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.name }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never pasted into the script.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "The version must look like v1.0.0, not '$VERSION'" >&2
            exit 1
          fi
          # The artifacts keep their release/<version>/ folders: attach the files inside.
          shopt -s globstar nullglob
          files=(dist/**/*.dmg dist/**/*.zip dist/**/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were built" >&2
            exit 1
          fi
          gh release create "$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cue $VERSION" \
            --generate-notes
